<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chess TMA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --light-sq: #ebeCd0;
    --dark-sq: #6b8f6b;
    --highlight: #f6f66955;
    --move-dot: #00000055;
    --accent: #4caf7d;
    --danger: #e05a5a;
    --text: #eee;
    --muted: #9aa0aa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  h2 { margin: 4px 0 12px; font-size: 1.1rem; font-weight: 600; }

  .player-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .player-bar.active { border: 1px solid var(--accent); }
  .player-bar .name { font-weight: 600; }
  .player-bar .clock-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px;
  }
  .player-bar.active .clock-dot { background: var(--accent); }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    margin: 6px 0;
  }
  .sq {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7vw;
    max-font-size: 32px;
    cursor: pointer;
    user-select: none;
  }
  @media (min-width: 480px) { .sq { font-size: 32px; } }
  .sq.light { background: var(--light-sq); }
  .sq.dark { background: var(--dark-sq); }
  .sq.selected { outline: 3px solid var(--accent) inset; }
  .sq .dot {
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: var(--move-dot);
    pointer-events: none;
  }
  .sq .dot.capture {
    width: 90%; height: 90%; background: transparent;
    border: 4px solid var(--move-dot); border-radius: 50%;
  }
  .sq .piece-white { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .sq .piece-black { color: #111; text-shadow: 0 1px 1px rgba(255,255,255,0.3); }

  #status {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 10px;
    font-size: 0.95rem;
    color: var(--muted);
    min-height: 1.4em;
  }
  #status.check { color: #f0c419; }
  #status.over { color: var(--accent); font-weight: 600; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  button.action {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
  }
  button.action.danger { color: var(--danger); border-color: var(--danger); }

  #promoModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #promoModal .box {
    background: var(--panel); border-radius: 12px; padding: 20px;
    display: flex; gap: 14px;
  }
  #promoModal button {
    font-size: 2rem; background: none; border: none; color: var(--text); cursor: pointer;
  }

  #home {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div id="home" style="display:none;">
    <h2>♟️ Chess TMA</h2>
    <p>Turnirga qo'shilish yoki o'yiningizni ochish uchun botdagi tugmani ishlating.</p>
  </div>

  <div id="game" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="player-bar" id="topBar">
      <span><span class="clock-dot"></span><span class="name" id="topName">—</span></span>
    </div>
    <div id="board"></div>
    <div class="player-bar" id="bottomBar">
      <span><span class="clock-dot"></span><span class="name" id="bottomName">—</span></span>
    </div>
    <div id="status">Ulanmoqda...</div>
    <div class="controls">
      <button class="action danger" id="resignBtn" style="display:none;">🏳️ Taslim bo'lish</button>
    </div>
  </div>

  <div id="promoModal">
    <div class="box">
      <button data-p="q">♛</button>
      <button data-p="r">♜</button>
      <button data-p="b">♝</button>
      <button data-p="n">♞</button>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const startParam = params.get("startapp") || params.get("tgWebAppStartParam") || "";
  const userId = tg?.initDataUnsafe?.user?.id || 0;

  const PIECE_UNICODE = {
    K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙",
    k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟",
  };

  let gameId = null;
  if (startParam.startsWith("watch_")) gameId = startParam.replace("watch_", "");
  else if (startParam.startsWith("play_")) gameId = startParam.replace("play_", "");

  const homeEl = document.getElementById("home");
  const gameEl = document.getElementById("game");
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const topNameEl = document.getElementById("topName");
  const bottomNameEl = document.getElementById("bottomName");
  const topBarEl = document.getElementById("topBar");
  const bottomBarEl = document.getElementById("bottomBar");
  const resignBtn = document.getElementById("resignBtn");
  const promoModal = document.getElementById("promoModal");

  if (!gameId) {
    homeEl.style.display = "block";
  } else {
    gameEl.style.display = "flex";
    startGame(gameId);
  }

  function startGame(gameId) {
    let currentFen = null;
    let role = "spectator";
    let yourColor = null;
    let turn = "white";
    let selectedSquare = null;
    let legalTargets = [];
    let pendingPromotion = null; // {from, to}

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/game/${gameId}?user_id=${userId}`);

    ws.onopen = () => { statusEl.textContent = "Ulandi"; };
    ws.onclose = () => { statusEl.textContent = "Ulanish uzildi"; };
    ws.onerror = () => { statusEl.textContent = "Xatolik yuz berdi"; };

    ws.onmessage = (ev) => {
      const data = JSON.parse(ev.data);

      if (data.type === "state") {
        role = data.role;
        yourColor = data.your_color;
        turn = data.turn;
        currentFen = data.fen;
        topNameEl.textContent = yourColor === "black" ? data.white_name : data.black_name;
        bottomNameEl.textContent = yourColor === "black" ? data.black_name : data.white_name;
        resignBtn.style.display = role === "player" ? "inline-block" : "none";
        renderFen(currentFen);
        updateStatusFromGameStatus(data.status, turn);
        updateActiveBar(turn);
      }

      if (data.type === "move") {
        currentFen = data.fen;
        turn = data.turn;
        selectedSquare = null;
        legalTargets = [];
        renderFen(currentFen);
        updateStatusFromGameStatus(data.status, turn);
        updateActiveBar(turn);
        if (data.status !== "ongoing") {
          resignBtn.style.display = "none";
          tg?.HapticFeedback?.notificationOccurred("success");
        } else {
          tg?.HapticFeedback?.impactOccurred("light");
        }
      }

      if (data.type === "legal_moves") {
        legalTargets = data.targets || [];
        renderFen(currentFen); // redraw with highlights
      }

      if (data.type === "error") {
        if (data.reason === "not_your_turn") flashStatus("Sizning navbatingiz emas");
        else if (data.reason === "illegal_move") flashStatus("Bunday yurish mumkin emas");
        else flashStatus("Xatolik: " + data.reason);
      }
    };

    function updateActiveBar(turnColor) {
      const bottomIsYou = yourColor !== "black"; // white (or spectator) shown at bottom by default
      const bottomColor = bottomIsYou ? "white" : "black";
      topBarEl.classList.toggle("active", turnColor !== bottomColor);
      bottomBarEl.classList.toggle("active", turnColor === bottomColor);
    }

    function flashStatus(msg) {
      const prev = statusEl.textContent;
      statusEl.textContent = msg;
      setTimeout(() => { statusEl.textContent = prev; }, 1500);
    }

    function updateStatusFromGameStatus(status, turnColor) {
      statusEl.classList.remove("check", "over");
      const turnLabel = turnColor === "white" ? "Oq" : "Qora";
      switch (status) {
        case "ongoing":
          statusEl.textContent = `${turnLabel} navbati`;
          break;
        case "checkmate":
          statusEl.textContent = "♚ Mot! O'yin tugadi.";
          statusEl.classList.add("over");
          break;
        case "stalemate":
          statusEl.textContent = "Pat — durang.";
          statusEl.classList.add("over");
          break;
        case "draw":
          statusEl.textContent = "Durang.";
          statusEl.classList.add("over");
          break;
        case "resigned":
          statusEl.textContent = "Taslim bo'lindi.";
          statusEl.classList.add("over");
          break;
        default:
          statusEl.textContent = status;
      }
    }

    function parseFen(fen) {
      const rows = fen.split(" ")[0].split("/");
      const board = [];
      rows.forEach((row) => {
        const rank = [];
        for (const ch of row) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < parseInt(ch); i++) rank.push(null);
          } else {
            rank.push(ch);
          }
        }
        board.push(rank);
      });
      return board; // board[0] = rank 8 ... board[7] = rank 1
    }

    function squareName(rankIdx, fileIdx) {
      // rankIdx 0 = rank8 (top of FEN) ... 7 = rank1
      const file = "abcdefgh"[fileIdx];
      const rank = 8 - rankIdx;
      return `${file}${rank}`;
    }

    function renderFen(fen) {
      if (!fen) return;
      const board = parseFen(fen);
      const flip = yourColor === "black";
      boardEl.innerHTML = "";

      for (let displayRow = 0; displayRow < 8; displayRow++) {
        for (let displayCol = 0; displayCol < 8; displayCol++) {
          const rankIdx = flip ? 7 - displayRow : displayRow;
          const fileIdx = flip ? 7 - displayCol : displayCol;
          const piece = board[rankIdx][fileIdx];
          const sqName = squareName(rankIdx, fileIdx);

          const div = document.createElement("div");
          div.className = "sq " + ((rankIdx + fileIdx) % 2 === 0 ? "light" : "dark");
          div.dataset.square = sqName;

          if (piece) {
            const span = document.createElement("span");
            span.textContent = PIECE_UNICODE[piece] || "";
            span.className = piece === piece.toUpperCase() ? "piece-white" : "piece-black";
            div.appendChild(span);
          }

          if (sqName === selectedSquare) div.classList.add("selected");
          if (legalTargets.includes(sqName)) {
            const dot = document.createElement("div");
            dot.className = "dot" + (piece ? " capture" : "");
            div.appendChild(dot);
          }

          div.addEventListener("click", () => onSquareClick(sqName, piece, board));
          boardEl.appendChild(div);
        }
      }
    }

    function isMyPiece(piece) {
      if (!piece || role !== "player") return false;
      const pieceColor = piece === piece.toUpperCase() ? "white" : "black";
      return pieceColor === yourColor && yourColor === turn;
    }

    function onSquareClick(sqName, piece, board) {
      if (role !== "player") return;

      if (legalTargets.includes(sqName) && selectedSquare) {
        const fromRank = 8 - parseInt(selectedSquare[1]);
        const isPawn = ["p", "P"].includes(board[fromRank]["abcdefgh".indexOf(selectedSquare[0])]);
        const targetRank = sqName[1];
        const isPromotion = isPawn && (targetRank === "8" || targetRank === "1");

        if (isPromotion) {
          pendingPromotion = { from: selectedSquare, to: sqName };
          promoModal.style.display = "flex";
        } else {
          sendMove(selectedSquare, sqName, "");
        }
        selectedSquare = null;
        legalTargets = [];
        return;
      }

      if (isMyPiece(piece)) {
        selectedSquare = sqName;
        ws.send(JSON.stringify({ type: "legal_moves_request", square: sqName }));
        renderFen(currentFen);
      } else {
        selectedSquare = null;
        legalTargets = [];
        renderFen(currentFen);
      }
    }

    function sendMove(from, to, promotion) {
      ws.send(JSON.stringify({ type: "move", uci: `${from}${to}${promotion}` }));
    }

    promoModal.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        promoModal.style.display = "none";
        if (pendingPromotion) {
          sendMove(pendingPromotion.from, pendingPromotion.to, btn.dataset.p);
          pendingPromotion = null;
        }
      });
    });

    resignBtn.addEventListener("click", async () => {
      if (!confirm("Rostdan ham taslim bo'lasizmi?")) return;
      await fetch(`/api/games/${gameId}/resign?user_id=${userId}`, { method: "POST" });
    });
  }
</script>
</body>
</html>
